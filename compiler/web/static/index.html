<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Wiki Compiler — Graph</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>LLM Wiki Compiler</h1>
  <span id="source"></span>
  <input id="search" type="search" placeholder="Search nodes (id or label)…" autocomplete="off">
  <button id="reset" type="button" title="丢弃保存的节点位置，恢复自动布局">重置布局</button>
</header>
<main>
  <div id="cy"></div>
  <aside id="info">
    <h2>Selection</h2>
    <div id="info-body">Click a node to see its details.</div>
  </aside>
</main>
<footer><span id="stats">loading…</span><span id="saved"></span></footer>
<div id="banner" hidden></div>
<!-- Vendored locally (static/vendor/) so the page needs no network access. -->
<script src="/static/vendor/cytoscape.min.js"></script>
<script src="/static/vendor/dagre.min.js"></script>
<script src="/static/vendor/cytoscape-dagre.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
