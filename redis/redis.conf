# Managed Redis for the LLM Wiki Compiler: RDB snapshots + AOF incremental log.
#
# Start it through scripts/redis-persistence.sh (WSL / Linux) or
# scripts/redis-persistence.ps1 (Windows) so that the startup performs the AOF
# health check and the RDB fallback described in redis/README.md.
#
# The scripts override dir/port/bind/logfile/appenddirname on the command line,
# so this file stays portable.

# --- durability: RDB (periodic full snapshots) ---
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
rdbcompression yes
rdbchecksum yes
stop-writes-on-bgsave-error yes

# --- durability: AOF (incremental writes) ---
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Hybrid: the beginning of the AOF is an RDB preamble, the rest is commands.
aof-use-rdb-preamble yes

# Redis 7 keeps the AOF in appendonlydir/; Redis 6 uses a single
# appendonly.aof. The startup script drops this line for Redis < 7.
appenddirname appendonlydir
appendfilename appendonly.aof

# --- runtime ---
bind 127.0.0.1
protected-mode yes
port 6379
daemonize no
dir ./data/redis
logfile ""
save_on_shutdown yes

# AOF loading is tolerant by default: a truncated tail is trimmed when
# aof-load-truncated is yes. We still validate the file before starting, so a
# corrupted file is quarantined instead of being silently trimmed.
aof-load-truncated yes
